# Snapshots every listing in extensions.json once a day and keeps the history on the
# `stats-data` branch (so no server or database hosting is needed). It also renders this
# week's digest to stats-data/digest.html, which the weekly email sends.
name: Collect stats

on:
  schedule:
    - cron: '17 11 * * *' # daily, ~7am US Eastern
  workflow_dispatch:

permissions:
  contents: write

concurrency: collect-stats

env:
  DATABASE_PATH: stats/tracker.db
  TZ: America/New_York

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check out history
        id: history
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: stats-data
          path: stats

      - name: Start history branch
        if: steps.history.outcome != 'success'
        run: |
          rm -rf stats && mkdir stats && cd stats
          git init -b stats-data
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Fetch store stats
        run: npm run fetch

      - name: Render weekly digest
        run: npx tsx server/cli.ts digest --preview --out stats

      - name: Save history
        working-directory: stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Stats for $(date +%F)"
          git push origin HEAD:stats-data
